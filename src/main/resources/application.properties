# ===== 事件接入与可靠处理配置 =====
# 本地持久化数据文件（Java 序列化，原子替换；无需任何外部服务）
eventing.data-file=data/events.dat
# 最大尝试次数（含首次处理）
eventing.max-attempts=5
# 指数退避
eventing.retry-base-delay=200ms
eventing.retry-max-delay=10s
eventing.retry-multiplier=2.0
# 排队/处理中容量上限，超过以 HTTP 503 限流拒绝
eventing.max-queue-capacity=1000
# 输入约束
eventing.max-key-length=128
eventing.max-payload-bytes=65536
# 后台重试 worker
eventing.worker-interval=100ms
eventing.worker-enabled=true

logging.level.com.github.highcumontoa=INFO
# 同一事件允许的最大重跑轮数（终止事件的受控重跑上限）
eventing.max-reruns=3
