spring.application.name=idempotent-event-ingestion

# ===== 事件接入与可靠处理配置 =====
# 本地事件快照存储目录（不依赖任何外部服务）
eventing.data-dir=data/eventing
# 在途容量上限（PENDING+PROCESSING），超出的新投递返回 503 限流
eventing.max-in-flight=1000
# 最大重试次数（不含首次处理尝试；attempt > maxRetries 即终止）
eventing.max-retries=3
# 指数退避：初始延迟(ms)、倍数、上限(ms)
eventing.backoff-initial-millis=200
eventing.backoff-multiplier=2.0
eventing.backoff-max-millis=5000
# 后台重试扫描间隔(ms)
eventing.scheduler-interval-millis=100
# 事件工作线程数
eventing.worker-threads=4

logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n
